services:
  redis:
    image: redis:7-alpine
    container_name: proclub-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - proclub-network

  backend:
    build:
      context: ./proclub-backend

    container_name: proclub-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./proclub-backend/.env

    volumes:
      - ./proclub-backend:/app
      - /app/node_modules

    depends_on:
      - redis

    networks:
      - proclub-network

  frontend:
    build:
      context: ./proclub-frontend

    container_name: proclub-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./proclub-frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - proclub-network

volumes:
  redis_data:

networks:
  proclub-network:
    driver: bridge